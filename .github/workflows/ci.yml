# CI for dialectic-playground/objc (Objective-C), from the curriculum's CI template
# (sdlc-curriculum/shared/ci/cross-platform-ci.yml).
#
# Every job runs the repository's make targets, so CI needs no edits as projects are
# implemented: `make check` covers the repository, the toolchain versions, and every
# project listed in IMPLEMENTED in the root Makefile.
# - Container (podman): `make check` in the toolchain image (./Containerfile), on Linux.
# - Native (Linux, macOS, Windows): `make check roundtrip` with DP_RUNTIME=local;
#   toolchain: Linux: GCC Objective-C + GNUstep Base (apt); macOS: Apple Clang + Foundation; Windows: MSYS2 CLANG64 with GNUstep Base and libobjc2.
#   Plus clang-format 19.1.7 (PyPI wheel, the container's version) for make lint / make format.
# - Shared tooling, DCO, and the required "CI result" check, as in every repository.
#
# Actions are pinned to full commit SHAs (organization policy); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Container (podman)
    runs-on: ubuntu-latest
    env:
      DP_RUNTIME: podman
    steps:
      - name: Check out repository (with curriculum submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Show toolchain environment
        run: make dp-info

      - name: make check
        run: make check

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DP_RUNTIME: local
    defaults:
      run:
        # Git Bash on Windows, so the Makefile's POSIX recipes behave identically everywhere.
        shell: bash
    steps:
      - name: Check out repository (with curriculum submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python (black-box test runner)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Ensure GNU Make is available
        if: runner.os == 'Windows'
        run: command -v make || choco install make --no-progress -y

      # macOS ships GNU Make 3.81; BASE-MAKEFILE requires >= 3.82.
      - name: Use current GNU Make (macOS)
        if: runner.os == 'macOS'
        run: brew install make && echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up GNUstep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gobjc gnustep-make libgnustep-base-dev

      - name: Set up GNUstep (Windows, MSYS2 CLANG64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          path-type: inherit
          install: >-
            make
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-libobjc2
            mingw-w64-clang-x86_64-gnustep-make
            mingw-w64-clang-x86_64-gnustep-base

      # clang-format from PyPI, pinned to the container's version (Debian trixie: 19.1.7), so
      # `make lint` judges formatting identically on every OS.
      - name: Install clang-format (lint / format)
        run: python -m pip install --disable-pip-version-check clang-format==19.1.7 && clang-format --version

      - name: make check roundtrip
        if: runner.os != 'Windows'
        run: make check roundtrip

      # MSYS2's clang package ships its own (newer) clang-format in /clang64/bin, which comes
      # first on the inherited PATH; put the PyPI 19.1.7 wheel's Scripts directory ahead of it.
      - name: make check roundtrip (MSYS2 CLANG64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          PATH="$(cygpath -u "$pythonLocation")/Scripts:$PATH"
          make check roundtrip

  shared-tooling:
    name: Shared tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tools/dp-run and tools/container.mk match the canonical copies
        run: |
          status=0
          for file in tools/dp-run tools/container.mk; do
            curl -fsSL "https://raw.githubusercontent.com/dialectic-playground/.github/main/$file" \
              | diff -u - "$file" \
              || { echo "::error::$file differs from the canonical copy in dialectic-playground/.github"; status=1; }
          done
          exit "$status"

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$commit")"
            case "$author" in *"[bot]@users.noreply.github.com>") continue ;; esac
            if ! git log -1 --format=%B "$commit" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $commit is missing 'Signed-off-by: $author' (use git commit -s)"
              status=1
            fi
          done
          exit "$status"

  ci-result:
    name: CI result
    if: always()
    needs: [container, native, shared-tooling, dco]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: All required jobs passed
        run: echo "All required jobs succeeded or were skipped."
